# ROCSAR configuration. Read by the On-Board Computer and by the Ground
# Station -- the two agree on purpose, and where they differ (the server half
# binds a wildcard, the client half dials an address) that difference is the
# point.
#
# Resolution order, highest first:
#
#     explicit flag  >  ROCSAR_* environment  >  this file  >  code default
#
# `rocsar.local.toml` is gitignored and merged over this file for per-machine
# overrides.
#
# DELIBERATELY ABSENT: every value below has a default in the code, and the
# defaults are NOT repeated here. A default written into this file is a second
# home for a fact, and two homes drift. An empty file is the correct state of
# this file on a fresh checkout. `obc --help` lists the defaults.
#
# An unrecognised key is ignored, not an error, so that a newer Ground Station
# carrying a key this OBC predates does not stop it from starting.

# Top-level, and therefore ABOVE the first [section] header.
#
# It sat under [qos]
# DELETED: bulk_rate_bps.
#
# It configured a token bucket inside the OBC, pacing the artefact HTTP copy
# path. That limiter is gone. The cap is now the kernel's, on the link device,
# set by [link] rate_kbps above and adjustable at runtime with the
# `set_link_limit` command -- which is what a Ground Station operator uses, and
# which bounds every flow on the interface rather than the one this process
# happens to serve.
#
# Two things this bought and one it cost. It bounded artefact bytes specifically,
# leaving the operator's own SSH alone; the kernel cap cannot make that
# distinction and throttles the whole device, which is the requirement it was
# kept for. And it needed no capability: this needs CAP_NET_ADMIN, so an unshaped
# OBC is now an UNBOUNDED link rather than a merely-unshaped one. See
# ARCHITECTURE.md 6.6.

[server]
# Bind endpoints. The wildcard is correct on the Pi and undialable from a
# laptop, which is why the client half below exists separately.
control_endpoint = "tcp://*:5555"
telemetry_endpoint = "tcp://*:5556"

[client]
# What the GROUND STATION dials. These are the values that have to change when
# DHCP moves the Pi, and they are the reason this section exists: the OBC half
# above binds a wildcard, which is correct on the Pi and undialable from a
# laptop.
#
# The console reads all three, so an operator who changes the Pi's address does it
# here once instead of retyping it into a flag every session. Anything more
# specific -- a mock OBC on loopback, a one-off bench box -- still goes in
# rocsar.local.toml, which is gitignored and merges over this file.
#
# Flags beat this file, which beats ROCSAR_* environment variables' file half,
# which beats the code default. See ARCHITECTURE.md 11.
control_endpoint = "tcp://172.16.18.131:5555"
telemetry_endpoint = "tcp://172.16.18.131:5556"
http_endpoint = "http://172.16.18.131:5557"

[http]
addr = ":5557"
# The SSD's mount point, and the only name for it.
#
# It is deliberately the same string as sdr.data_dir below and the same string as
# the acquisition program's own `#define SSD_PATH`. Three names for one disk is
# what hid 5.4 GB of captures: the program wrote to /mnt/rocsar_ssd, this file
# served /mnt/ssd, and the code defaulted to /mnt/rocsar/data.
#
# Nothing was deleted -- the captures were always written somewhere, and the
# program's SSD write is caught and retried onto the SD card. But with the SSD
# unmounted, /mnt/rocsar_ssd was an ordinary directory on the SD card, so those
# writes succeeded into the wrong disk in duplicate, the Ground Station listed
# none of them, and nothing said so.
#
# /mnt/ssd was the third name and no longer exists. Do not reintroduce it: two
# mount points for one filesystem is two things to keep in sync, and only one of
# them can be the program's SSD_PATH without editing C++ we do not maintain.
root = "/mnt/rocsar_ssd"

# The disk's filesystem UUID, asserted at startup.
#
# A USB drive that drops off the bus -- and this one did, ending in "Synchronize
# Cache failed: hostbyte=0x07", the disk vanishing mid-flush -- does not remove
# its mount point. It leaves an ordinary writable directory on the SD card. Every
# other startup check passes, the OBC serves telemetry, and every capture lands
# on the wrong disk. This is the check that makes that fatal instead: it compares
# what is actually mounted here against the disk named below.
#
# Set it to "" on a laptop, where there is no second filesystem to be on.
device = "a82c5820-9183-45ba-bf2f-a956f6dec4cd"
# The port in `addr` is load-bearing. The kernel's flower filter classifies bulk
# traffic on `dst_port 5557`, and it is a constant (config.BulkPort), not a key
# here. If the two disagree the failure is silent: downloads join the priority
# class, the priority class starves, and nothing reports an error. Startup
# refuses a mismatched pair rather than discovering it in flight.

[link]
device = "eth0"
# Kilobits per second. The air link is 115 kbit/s and that is a property of the
# radio, not a tuning knob. Re-applied at every start, so restarting the OBC
# returns to the launch value.
rate_kbps = 115
# Needs CAP_NET_ADMIN, and with the in-process limiter gone that is a deployment
# requirement rather than a tuning choice: shaping = false now means the link is
# UNBOUNDED, because nothing else in this program limits it.
#
# ON by default. This installs an HTB tree with ONE class at rate_kbps, so the
# number above is the cap -- measured on the target at 115 kbit/s. It bounds every
# flow on the device, including the operator's own SSH, which is the requirement
# it is kept for.
#
# What it does NOT do is tell traffic apart. There is no classifier, so telemetry
# and artefact downloads share the one class: a download can use the whole cap and
# telemetry waits behind it. That is acceptable because the cap is far larger than
# telemetry needs -- a 1 Hz frame is 3.2 kbit/s against 115 -- but it means a very
# large capture shares with telemetry rather than being isolated from it.
#
# The tc flower filter that was meant to classify is retired. It had no classid,
# so it matched packets and diverted nothing; the root default was the bulk class,
# so the priority class was unreachable; and after fixing both, on a classful tree
# with GRO/GSO disabled, a 30 KB artefact fetch still landed in the priority class
# and the bulk class stayed at zero packets. Re-adding a filter without reading
# internal/qos/shaper.go would look like a fix while nothing is actually steered.
#
# rate_kbps is never allowed below qos.MinimumRateKbps -- enough for one
# worst-case telemetry frame per second. A request below that is clamped up and
# the reason is reported, because running the link unbounded is worse than capping
# it slightly too high. Adjust it at runtime with the `set_link_limit` command.
shaping = true

[pico]
port = "/dev/ttyACM0"
# The USB link rate to the Pi. NOT the ST3215 servo bus rate, which is also
# 115200 and is unrelated. Two buses, one coincidental number.
baudrate = 115200

[gnss]
# One entry per Read_uB instance.
ports = [2001, 2002, 2003]
# Which receiver is trusted, by 1-based ID: 1 is the first entry in `ports`.
# Must be in range. Selection is explicit and never automatic; the other
# receivers are still reported so the redundancy is visible.
selected = 1
# A fix older than this reports fix_ok = false even though the last decoded
# value was valid. An old fix is worse than no fix.
stale_after = "2s"

[camera]
device = "/dev/video0"

# The capture settings, and the ONLY thing in this section that is a default
# rather than a fact: these five are the value in force until somebody changes
# one, and after that the file `.camera-params.json` in the data root wins over
# them. The Ground Station writes that file when an operator applies a change, so
# the precedence is
#
#     .camera-params.json on the SSD  >  these keys  >  fswebcam's own defaults
#
# which is why a change made in the window survives an OBC restart and a change
# made here does not. Delete the settings file to get these back.
#
# Every value below is fswebcam's OWN default, spelled out. That is deliberate:
# before these keys existed the camera passed no resolution at all, so fswebcam
# asked the device for 384x288 and every photograph this system ever took was a
# quarter-megapixel one. Naming the same request changes nothing and makes it
# visible.
#
# Bounds and where each comes from: internal/camera/params_contract.go, which
# cites the fswebcam(1) man page for every one. They are fswebcam's, not the
# camera's -- a resolution here is a REQUEST, and the driver may decline it. The
# OBC reports the decoded size of what it actually wrote, so a clamp is visible
# rather than silent.

# JPEG compression factor, 1..95. 0 is fswebcam's "automatic", which is what it
# does by default. At 115 kbit/s this is the single biggest lever on how long a
# photograph takes to fetch: near 40 is the difference between seconds and
# minutes for a small frame.
quality = 0

# Requested capture size as WxH. fswebcam's man page is explicit that "the actual
# resolution used may differ if the source or device cannot capture at the
# specified resolution", so a value this camera cannot do is clamped, not
# refused.
resolution = "384x288"

# Frames averaged into the output, 1..8. More frames is less noise AND more blur,
# and this camera is on a moving gondola.
frames = 1

# Frames captured and thrown away first, 0..60. For a camera whose first frames
# after opening are dark or corrupt, which the fswebcam man page says some are.
# Left at 0 because raising it here would change what photographs look like
# without anybody asking.
skip = 0

# Milliseconds to let the image settle between opening the device and capturing.
# 0 does not wait.
delay_ms = 0

[sdr]
# The directory holding parameters/params.json and Data/ -- NOT the connect
# binary, which is found on PATH (see README, "The SDR program on the Pi").
# It is also the working directory the program is started in, because the C++
# resolves its own config path and its second capture copy against CWD.
#
# The name is load-bearing, not cosmetic: connect.cpp hardcodes
# "./../sdr-ettus-b200mini/parameters/params.json", so this only reaches the file
# above if the directory is called sdr-ettus-b200mini. The OBC refuses to start
# an acquisition when it does not, rather than writing parameters the program
# would never read. On the Pi, override with ROCSAR_SDR_PROGRAM instead.
program = "/root/rocsar-rpi/sdr-ettus-b200mini"

# Where the program writes its capture: the program's own `#define SSD_PATH`.
#
# A second home for a fact owned by C++ we do not maintain, which is what makes
# it worth stating. Connect checks this directory exists, is writable, and has
# room for the capture the configured parameters will produce -- so an acquisition
# whose output this OBC could not serve is refused up front instead of written
# somewhere invisible.
#
# It equals http.root above and must stay equal to it. When they diverged, the
# program wrote to this one and the artefact server served the other.
data_dir = "/mnt/rocsar_ssd"

[telemetry]
interval = "1s"

[qos]
# DELETED: bulk_rate_bps.
#
# It configured a token bucket inside the OBC that paced the artefact HTTP copy
# path. That limiter is gone. The cap is now the kernel's, on the link device,
# set by [link] rate_kbps above and adjustable at runtime with the
# `set_link_limit` command -- which is what a Ground Station operator uses, and
# which bounds every flow on the interface rather than the one this process
# happens to serve.
#
# Two things it bought, and one it cost. It bounded artefact bytes specifically,
# leaving the operator's own SSH alone; the kernel cap makes no such
# distinction and throttles the whole device, which is why it was kept. And it
# needed no capability: this needs CAP_NET_ADMIN, so an unshaped OBC is now an
# UNBOUNDED link rather than a merely unshaped one. See ARCHITECTURE.md 6.6.
