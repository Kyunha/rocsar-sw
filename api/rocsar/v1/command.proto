syntax = "proto3";

// Ground Station -> OBC commands.
//
// EXCLUDED from RP2040 firmware generation. The firmware learns new struct
// shapes through gondola_model.h, not through this file -- see ARCHITECTURE.md
// 4.4. If you find yourself wanting to add a message here that the firmware
// would have to carry, the answer is almost always "the OBC should translate
// it" and never "the firmware should learn a new message".
package rocsar.v1;

import "rocsar/v1/common.proto";
import "rocsar/v1/pico.proto";

option go_package = "github.com/rocsar/obc/api/rocsar/v1;rocsarv1";

// ---------------------------------------------------------------------------
// SDR
// ---------------------------------------------------------------------------

// Partial update of parameters/params.json. Every field is optional: an absent
// field means "leave it alone", which is why this is `optional` and not a
// zero. A PRF of 0 is not a request to set PRF to 0.
//
// Validation happens host-side before the write. The JSON is a frozen contract
// with the vendored C++ program and a value it cannot use is a bricked SDR, not
// a runtime error.
message SdrParams {
  optional double prf_hz = 1;
  optional double sample_rate_hz = 2;
  optional double tx_freq_hz = 3;
  optional double normalized_gain_tx = 4;
  optional double normalized_gain_rx = 5;
  optional double bandwidth_hz = 6;
  optional uint32 session_duration_s = 7;

  // The sweep window, the pre-burst delay and the antenna ports. These five
  // keys were absent from the settable surface while config.hpp has always
  // read all of them with j.at(), which made the file's own contract
  // unreachable from an operator and left the capture geometry -- how wide the
  // sweep is, how long after arm the first burst fires, which RF path is wired
  // -- a hand edit on the aircraft.
  //
  // They are not decorative. config.hpp throws on start_offset_s <= 0 and on
  // t_min_us >= t_max_us, so a value pair it refuses is a bricked SDR with no
  // recovery except editing the file by hand. Per-key bounds cannot express the
  // second of those, so internal/sdr checks the pair as well; see
  // params_contract.go.
  optional double t_min_us = 8;
  optional double t_max_us = 9;
  optional double start_offset_s = 10;

  // Antenna ports are strings, not an enum: the legal set is whatever
  // UHD::set_tx_antenna accepts on this radio and firmware, which is a question
  // for the device and not for this schema. "TX/RX" is the monostatic default
  // in the shipped file.
  optional string tx_antenna = 11;
  optional string rx_antenna = 12;

  // There is deliberately no pulse_duration field, and field numbers are packed
  // rather than leaving a hole at the number it would have taken.
  //
  // third_party/sdr-ettus-b200mini/parameters/config.hpp reads
  // `c.pulse_duration = j.at("PULSE_DURATION")` with that line COMMENTED OUT, so
  // the program does not read the key at all. A field here would be a control
  // that appears to work and does nothing, which is worse than its absence. The
  // key stays in the shipped params.json and is carried through every update
  // untouched.
  //
  // Nothing has shipped against this schema, so renumbering costs nobody
  // anything. Contrast GnssReceiverStatus, where number 9 IS reserved because a
  // Ground Station may already carry a varint there.
}

message SdrConnectCommand {}

message SdrSetParamsCommand {
  SdrParams params = 1;
}

message SdrResetUSBCommand {}

message SdrProbeCommand {}

// Reads parameters/params.json. The read side of sdr_set_params: the GUI
// shows current values as placeholder hints while blank inputs keep meaning
// "leave alone", and a read that fails is surfaced, never guessed.
message SdrGetParamsCommand {}

// ---------------------------------------------------------------------------
// Camera
// ---------------------------------------------------------------------------

// Partial update of the capture settings. Every field is optional: absent means
// "leave it alone". A JPEG quality of 0 is a real value meaning "automatic",
// and that is exactly why this cannot be a plain uint32 -- see the field.
//
// # Why these exist
//
// Until they existed, nothing could set the resolution, quality, frame count or
// settle time of a photograph: NewCapture took a quality argument that it stored
// and never read, so the one "quality" input in the system was a control that
// did nothing. Worse, every photograph was taken at whatever mode fswebcam asks
// for when given no -r, which its man page puts at 384x288 -- so the port's own
// "one full-resolution JPEG" claim was not true either. Both are fixed here, and
// internal/camera/params_contract.go carries the bounds with the man-page line
// each one came from.
//
// # The resolution is one string, not two numbers
//
// A V4L2 format is a single setting. `width` without `height` is not a state the
// device can be in, it is a request the driver clamps to something arbitrary,
// and we would report back a resolution the operator never asked for. One
// "WxH" field maps one-to-one onto the `-r` argument, which is the other reason
// it is not two fields.
message CameraParams {
  // JPEG compression factor, fswebcam's `--jpeg <factor>`, 0..95.
  //
  // Zero means automatic, which is fswebcam's own default of -1 -- NOT "quality
  // zero". libjpeg/GD at factor 0 produces a file so small it is not a usable
  // photograph, so the automatic case is carried in the zero and 0 is never
  // passed to the program. That is also why it is `optional`: absent is "leave
  // it alone", present-and-zero is "go back to automatic", and a plain uint32
  // cannot tell those apart.
  optional uint32 jpeg_quality = 1;

  // Capture resolution as `WxH`, passed through to fswebcam's `-r`.
  //
  // The man page is explicit that "the actual resolution used may differ if the
  // source or device cannot capture at the specified resolution", so this is a
  // REQUEST and never a report. What the camera actually delivered is decoded
  // out of the JPEG and reported on the artefact, because a console that
  // displays the requested resolution is displaying a number no device ever
  // agreed to.
  //
  // Empty is rejected rather than taken as "the device default": 384x288 is
  // fswebcam's default, not the camera's, and silently capturing at a size
  // neither the operator nor the hardware chose is the failure this file exists
  // to end. Send no field to leave the setting alone.
  optional string resolution = 2;

  // Frames to average into the output, fswebcam's `-F <number>`, 1..8.
  //
  // The man page: "More frames mean less noise in the final image, however
  // capture times will be longer and moving objects may appear blurred." Both
  // halves are why the ceiling is 8 and not 30: this is a camera on a moving
  // gondola, where a long average smears the horizon.
  optional uint32 frames = 3;

  // Frames to capture and discard before the real one, fswebcam's `-S <number>`.
  //
  // The man page's reason, which is the reason this is offered at all: "use
  // this option if your camera sends some bad or corrupt frames when it first
  // starts capturing." That is the behaviour of the USB camera on the aircraft.
  optional uint32 skip = 4;

  // Settle time after the device is opened and before capture begins,
  // fswebcam's `-D <delay>`. Milliseconds here, because a sub-second wait is
  // what "let the image settle" means and float seconds on the wire is a value
  // that has to be parsed and reported back.
  //
  // The man page: "Some devices need this delay to let the image settle after a
  // setting has changed."
  optional uint32 delay_ms = 5;
}

message CameraSetParamsCommand {
  CameraParams params = 1;
}

// Reads the capture settings in force, as JSON. The read side of
// camera_set_params: the GUI shows current values as placeholder hints while
// blank inputs keep meaning "leave alone", and a read that fails is surfaced,
// never guessed. Same contract and same failure mode as SdrGetParamsCommand.
message CameraGetParamsCommand {}

// The photograph is taken with whatever parameters are in force at the moment
// the command arrives. It carries none of them on the wire: the response
// reports the ARTEFACT that came out -- its name, size and decoded dimensions --
// and the settings themselves are readable with camera_get_params. A command
// that both set and captured would make the settings that produced a given
// photograph unrecoverable after the fact.
message TakePhotoCommand {}

// ---------------------------------------------------------------------------
// GNSS receiver bank
// ---------------------------------------------------------------------------

// Make receiver_id the selected one. Selection is explicit and never automatic;
// `mode` on GnssSelectCommand exists only to rotate deliberately.
message GnssSelectCommand {
  uint32 receiver_id = 1;
  bool rotate = 2;
}

// ---------------------------------------------------------------------------
// Link shaping
// ---------------------------------------------------------------------------

message LinkSetLimitCommand {
  uint32 rate_kbps = 1;
}

// ---------------------------------------------------------------------------
// Telemetry rate
// ---------------------------------------------------------------------------

message TelemetrySetRateCommand {
  uint32 interval_ms = 1;
}

// ---------------------------------------------------------------------------
// System
// ---------------------------------------------------------------------------

message SystemResetCommand {}

message QueryStatusCommand {}

// ---------------------------------------------------------------------------
// The envelope.
// ---------------------------------------------------------------------------

// One frame from the Ground Station.
//
// `pico` is a nested message that has its own oneof, rather than the eight
// servo commands being flattened into this oneof alongside the system commands.
// Flattening would put 16 unrelated commands in one flat list, and the
// discriminating information ("this is a Pico command, and which one") would
// stop being structural.
message CommandRequest {
  // Chosen by the Ground Station and echoed in CommandResponse. Without it a
  // reply cannot be matched to the control that caused it.
  string request_id = 1;

  oneof payload {
    PicoCommand pico = 2;
    SdrConnectCommand sdr_connect = 3;
    SdrSetParamsCommand sdr_set_params = 4;
    SdrResetUSBCommand sdr_reset_usb = 5;
    SdrProbeCommand sdr_probe = 6;
    SdrGetParamsCommand sdr_get_params = 12;
    TakePhotoCommand take_photo = 7;
    GnssSelectCommand gnss_select = 8;
    LinkSetLimitCommand link_set_limit = 9;
    SystemResetCommand system_reset = 10;
    QueryStatusCommand query_status = 11;
    TelemetrySetRateCommand telemetry_set_rate = 13;
    CameraSetParamsCommand camera_set_params = 14;
    CameraGetParamsCommand camera_get_params = 15;
  }
}

message CommandResponse {
  string request_id = 1;
  bool success = 2;
  ErrorCode error = 3;
  string message = 4;

  // For take_photo: where the operator should fetch the bytes. The image is
  // never carried in the response -- it goes over HTTP :5557. Constraint H1 in
  // ARCHITECTURE.md is why this field is a name and not bytes.
  optional string artefact_name = 5;
  optional uint64 artefact_size_bytes = 6;
  optional string artefact_kind = 7;
}