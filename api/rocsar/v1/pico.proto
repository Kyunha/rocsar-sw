syntax = "proto3";

// The Raspberry Pi <-> RP2040 flight controller link.
//
// This is the ONLY file the RP2040 compiles from (with common.proto). Ground
// Station messages live in command.proto and telemetry.proto and are excluded
// from firmware generation by name -- see ARCHITECTURE.md 4.4.
//
// Porting note -- READ BEFORE PORTING THE FIRMWARE
// ================================================
//
// This schema is NOT field-number compatible with the one the shipped firmware
// was built against. An earlier version of this comment claimed it was, and
// that claim was false in both halves. It is reproduced here because someone
// will otherwise trust it and skip a step that matters.
//
// The shipped flight controller was built against `pico_protocol.proto`, which
// numbered these oneofs from 10. This file numbers them from 2:
//
//   PicoCommand.payload    set_target  10 -> 2     jog      11 -> 3
//                          zero        12 -> 4     mount    13 -> 5
//                          dir         14 -> 6     heater   15 -> 7
//                          stop        16 -> 8     status_request 17 -> 9
//   PicoMessage.payload    ack          10 -> 3     telemetry 11 -> 4
//
// And in AntennaTelemetry, two fields swapped places -- same names, same types,
// different numbers:
//
//   temperature_c    5 -> 6
//   load             6 -> 5
//
// What is genuinely mechanical:
//
//   - The message renames: CommandMessage -> PicoCommand, CommandResponse ->
//     PicoAck, TelemetryMessage -> PicoTelemetry, and every
//     `telemetry_system_pico_*` symbol -> `rocsar_v1_*`.
//   - ErrorCode 0..4 kept their numbers (ERROR_NONE, ERROR_INVALID_COMMAND,
//     ERROR_INVALID_PARAMETER, ERROR_INVALID_SERVO, ERROR_INVALID_HEATER), so
//     error mapping needs no table. Codes 5..8 were reserved in the old schema
//     and carry meaning here.
//
// What is NOT mechanical, and is the whole reason this note exists:
//
//   - Assign fields by NAME, never by number. The regenerated pico.pb.h makes
//     the new numbering correct by construction, so a build against it is
//     right; anything hand-numbered is wrong in a way that compiles.
//   - The load/temperature_c swap is the dangerous one, because both are int32
//     and both survive a wire round trip. Reading `load` where the firmware
//     wrote `temperature_c` reports a servo at -100% load and 85 C at the same
//     time, and neither value is out of range for its type.
//   - A stale pico_protocol.pb.h left in the sketch folder compiles happily and
//     produces a link that passes every host test and sends frames the flight
//     controller cannot parse. `firmware/` must contain the generated header
//     from THIS schema and no other.
//
// A field number is the wire. Do not renumber these fields.
package rocsar.v1;

import "rocsar/v1/common.proto";

option go_package = "github.com/rocsar/obc/api/rocsar/v1;rocsarv1";

// ---------------------------------------------------------------------------
// OBC -> Pico. The oneof IS the discriminant: there is no `kind` string that
// can disagree with the payload it describes.
// ---------------------------------------------------------------------------

message SetTargetCommand {
  float target_heading_deg = 1;
}

// Absolute tick, valid 0..4095, in manual mode for that axis.
message JogCommand {
  uint32 servo_id = 1;
  uint32 tick = 2;
}

// Return an axis to its mechanical centre (center_tick).
message ZeroCommand {
  uint32 servo_id = 1;
}

message MountCommand {
  uint32 servo_id = 1;
  float offset_deg = 2;
}

// Direction multiplier. Only +1.0 and -1.0 are legal; anything else is a
// parameter error, checked host-side before it reaches the wire.
message DirCommand {
  uint32 servo_id = 1;
  float multiplier = 2;
}

message HeaterCommand {
  uint32 heater_id = 1;
  bool state = 2;
}

message StopCommand {
  uint32 servo_id = 1;
}

message StatusRequestCommand {}

message PicoCommand {
  uint32 sequence = 1;

  oneof payload {
    SetTargetCommand set_target = 2;
    JogCommand jog = 3;
    ZeroCommand zero = 4;
    MountCommand mount = 5;
    DirCommand dir = 6;
    HeaterCommand heater = 7;
    StopCommand stop = 8;
    StatusRequestCommand status_request = 9;
  }
}

// ---------------------------------------------------------------------------
// Pico -> OBC: acknowledgement. One per PicoCommand, echoed command_sequence.
// ---------------------------------------------------------------------------

message PicoAck {
  uint32 command_sequence = 1;
  bool success = 2;
  ErrorCode error = 3;
}

// ---------------------------------------------------------------------------
// Pico -> OBC: telemetry, emitted once per 50 Hz control tick.
// ---------------------------------------------------------------------------

message PicoTelemetry {
  float gondola_heading_deg = 1;
  float target_heading_deg = 2;
  bool heater1_state = 3;
  bool heater2_state = 4;
  repeated AntennaTelemetry antennas = 5;

  // Whether gondola_heading_deg is a measurement. False when no BNO055 is
  // fitted, in which case the heading is the last bearing *held* rather than a
  // reading, and the two are indistinguishable without this bit. A blank proto3
  // frame defaults to false, so a frame from a firmware predating this field
  // reads as "no measurement", which is the honest reading of one.
  bool imu_present = 6;
}

// ---------------------------------------------------------------------------
// The COBS payload. One frame, one direction-agnostic envelope.
// ---------------------------------------------------------------------------

message PicoMessage {
  uint32 sequence = 1;
  uint64 timestamp_us = 2;

  oneof payload {
    PicoAck ack = 3;
    PicoTelemetry telemetry = 4;
  }
}